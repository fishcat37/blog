{{- /* 先触发 Markdown 渲染钩子，再检查公式标记。 */}}
{{- $noop := .WordCount }}
{{- if .Store.Get "hasMath" }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
      integrity="sha384-u1zONI5gPXUx0UKI62c75/zww972y0v2rSK5ZYlVdS6xEuWDeZWUI66v6t1gvlXJ"
      crossorigin="anonymous">
{{- end }}

{{- /* PaperMod 会缓存页脚，按页面加载的脚本放在这里。模块脚本会在文档解析完成后执行。 */}}
{{- if .Store.Get "hasMermaid" }}
  {{- $script := resources.Get "js/mermaid.js" | minify | fingerprint }}
<script type="module" src="{{ $script.RelPermalink }}"
        integrity="{{ $script.Data.Integrity }}" crossorigin="anonymous"></script>
{{- end }}
